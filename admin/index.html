<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Süleyman Ay — Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside><div class="brand">Süleyman Ay<small>ADMIN / YAYIN STÜDYOSU</small></div><nav><button class="active" data-view="editor">Yazı Editörü</button><button data-view="posts">Yazılar</button><button data-view="media">Medya</button><button data-view="settings">Ayarlar</button></nav></aside><main><header><div><span>YAYIN STÜDYOSU</span><h1 id="titleView">Yeni Yazı</h1></div><div class="actions"><button id="preview">Önizle</button><button id="draft">Taslağı Kaydet</button><button class="primary" id="publish">Yayınla</button></div></header><section id="editorView" class="view active"><div class="grid"><article class="paper"><input id="title" placeholder="Başlık"><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="formatBlock" data-value="h2">H2</button><button data-cmd="formatBlock" data-value="blockquote">Alıntı</button><button data-cmd="insertUnorderedList">Liste</button><button id="link">Link</button><label>Görsel<input id="image" type="file" accept="image/*"></label><button id="draw" class="draw">Keçeli Kalem</button></div><div id="editor" contenteditable="true" data-placeholder="Yazını buraya yaz..."></div><footer><span id="count">0 kelime</span><span id="status">Hazır</span></footer></article><aside class="meta"><h2>Yayın</h2><label>Özet<textarea id="excerpt"></textarea></label><label>Kategori<input id="category"></label><label>Etiketler<input id="tags" placeholder="virgülle ayır"></label><label>Yayın tarihi<input id="date" type="datetime-local"></label><label><input id="featured" type="checkbox"> Öne çıkar</label><label><input id="comments" type="checkbox" checked> Yorumlara izin ver</label></aside></div></section><section id="postsView" class="view"><div class="panel"><h2>Yazılar</h2><div id="posts"></div></div></section><section id="mediaView" class="view"><div class="panel"><h2>Medya</h2><p>Görseller yazı editöründen eklenir ve içerikle birlikte saklanır.</p></div></section><section id="settingsView" class="view"><div class="panel"><h2>Ayarlar</h2><label><input id="haptic" type="checkbox"> Haptic geri bildirim</label><label><input id="reduced" type="checkbox"> Hareketleri azalt</label></div></section></main></div><div id="modal" class="modal hidden"><div class="drawbox"><header><h2>Keçeli Kalem</h2><div><button id="undo">Geri Al</button><button id="clear">Temizle</button><button id="close">Kapat</button><button class="primary" id="insert">Yazıya Ekle</button></div></header><div class="tools"><label>Kalınlık <input id="size" type="range" min="2" max="40" value="8"></label><label>Renk <input id="color" type="color" value="#1b120b"></label><button id="eraser">Silgi</button></div><canvas id="canvas"></canvas><small>Mouse, parmak veya kalemle çiz.</small></div></div><script src="admin.js"></script></body></html>
